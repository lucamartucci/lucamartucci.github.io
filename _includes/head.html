<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="37H6dBVN8sl74TIFuCPhlTXmAyuUzRL1r88V1uaxx9U" />
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ site.author.name }}">
  <meta name="theme-color" content="#0f2341">

  <!-- Colour theme: saved choice, otherwise the visitor's system setting. Runs before paint to avoid a flash. -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <title>{% if page.title == "Home" %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <link rel="icon" href="{{ site.baseurl }}/public/favicon.ico">
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/public/apple-touch-icon-144-precomposed.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/site.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/syntax.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.author.name }}",
    "url": "{{ site.url }}",
    "jobTitle": "PhD student in Mathematics",
    "affiliation": { "@type": "CollegeOrUniversity", "name": "Imperial College London" },
    "sameAs": ["https://profiles.imperial.ac.uk/luca.martucci25", "https://github.com/lucamartucci"]
  }
  </script>

  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ site.baseurl }}/atom.xml">

  <!-- MathJax (for $...$ in notes/posts) -->
  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      TeX: { equationNumbers: { autoNumber: "all" } },
      tex2jax: { inlineMath: [ ['$','$'], ["\\(","\\)"] ], processEscapes: true }
    });
  </script>
  <script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script>
</head>
